<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ear eval (dev only)</title>
  </head>
  <body>
    <script type="module">
      import { VoskEngine } from '/src/infrastructure/ear/vosk.ts';
      import { SAMPLE_RATE } from '/src/application/ports.ts';

      const BLOCK = SAMPLE_RATE / 10;
      const engine = new VoskEngine();

      async function samples(url) {
        const bytes = await (await fetch(url)).arrayBuffer();
        const decoded = await new AudioContext().decodeAudioData(bytes);
        const length = Math.ceil(decoded.duration * SAMPLE_RATE);
        const offline = new OfflineAudioContext(1, length, SAMPLE_RATE);
        const source = offline.createBufferSource();
        source.buffer = decoded;
        source.connect(offline.destination);
        source.start();
        return (await offline.startRendering()).getChannelData(0);
      }

      window.__ear = {
        load: () => engine.load(() => undefined),
        async transcribe(url) {
          const audio = await samples(url);
          engine.begin(() => undefined);
          for (let i = 0; i < audio.length; i += BLOCK) engine.feed(audio.slice(i, i + BLOCK));
          return engine.finish();
        },
      };
    </script>
  </body>
</html>
