name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deploy in flight. Cancelling the *run* does not cancel the Pages
  # *deployment* it already queued, and that orphan blocks the queue: every later run then
  # sits in `deployment_queued` until it times out.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # ear-assets.sh looks for the packaged model in ~/.cache/vacilon-oido and downloads it if missing.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/vacilon-oido
          key: vosk-model-small-es-0.42
      - run: npm run ear
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v5
