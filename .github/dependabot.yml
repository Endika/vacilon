version: 2
updates:
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      security-npm:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: "ci(actions)"
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(py-deps)"
    groups:
      security-pip:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      py-minor-and-patch:
        update-types: [minor, patch]
