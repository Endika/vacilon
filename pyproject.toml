[project]
name = "vacilon"
version = "0.1.8"
description = "Spanish terminal chat that answers with banter, using a small own model"
requires-python = ">=3.12"
dependencies = ["numpy", "tokenizers"]

[project.scripts]
vacilon = "vacilon.cli:main"

[project.optional-dependencies]
train = ["torch"]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacilon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
